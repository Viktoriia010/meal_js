<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MealDB</title>

    <link href="./styles/bootstrap.min.css" rel="stylesheet" />
    <script defer type="module" src="./dist/index.js"></script>
  </head>
  <body>
    <!-- Header -->
    <nav class="navbar navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="#"> 🍽 Meal Explorer </a>

        <form id="food-search" class="d-flex">
          <input
            id="food-input"
            class="form-control me-2"
            type="search"
            placeholder="Пошук страви"
          />
          <button id="find" class="btn btn-warning">Знайти</button>
        </form>
      </div>
    </nav>

    <!-- Hero -->
    <section class="bg-light py-5">
      <div class="container text-center">
        <h1>Каталог рецептів</h1>
        <p class="lead">Знайди улюблену страву та переглянь рецепт</p>
      </div>
    </section>

    <section class="container py-4">
      <div class="row g-4" id="meals-container"></div>
    </section>

    <!-- Categories -->
    <section class="container py-5">
      <h2 class="mb-4">Категорії</h2>

      <div class="row g-3">
        <div class="col-md-3">
          <button class="btn btn-outline-primary w-100">Beef</button>
        </div>

        <div class="col-md-3">
          <button class="btn btn-outline-primary w-100">Chicken</button>
        </div>

        <div class="col-md-3">
          <button class="btn btn-outline-primary w-100">Dessert</button>
        </div>

        <div class="col-md-3">
          <button class="btn btn-outline-primary w-100">Lamb</button>
        </div>
        <div class="col-md-3">
          <button class="btn btn-outline-primary w-100">Miscellaneous</button>
        </div>
        <div class="col-md-3">
          <button class="btn btn-outline-primary w-100">Pasta</button>
        </div>
        <div class="col-md-3">
          <button class="btn btn-outline-primary w-100">Pork</button>
        </div>
        <div class="col-md-3">
          <button class="btn btn-outline-primary w-100">Seafood</button>
        </div>

        <div class="col-md-3">
          <button class="btn btn-outline-primary w-100">Side</button>
        </div>
        <div class="col-md-3">
          <button class="btn btn-outline-primary w-100">Starter</button>
        </div>
        <div class="col-md-3">
          <button class="btn btn-outline-primary w-100">Vegan</button>
        </div>
        <div class="col-md-3">
          <button class="btn btn-outline-primary w-100">Vegetarian</button>
        </div>
        <div class="col-md-3">
          <button class="btn btn-outline-primary w-100">Breakfast</button>
        </div>

        <div class="col-md-3">
          <button class="btn btn-outline-primary w-100">Goat</button>
        </div>
      </div>
    </section>

    <!-- Meals -->
    <section id="popular-section" class="container pb-5">
      <h2 class="mb-4">Популярні страви</h2>

      <div id="popular" class="row g-4"></div>
    </section>

    <!-- Modal -->
    <div class="modal fade" id="mealModal" tabindex="-1">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Назва страви</h5>

            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>

          <div class="modal-body p-5">
            <img
              src="https://via.placeholder.com/800x400"
              class="img-fluid rounded mb-3"
              alt="Meal"
            />

            <h4>Інгредієнти</h4>

            <ul>
              <li>Інгредієнт 1</li>
              <li>Інгредієнт 2</li>
              <li>Інгредієнт 3</li>
            </ul>

            <h4>Інструкція</h4>

            <p>Тут буде текст рецепта.</p>
          </div>
        </div>
      </div>
    </div>

    <script src="./js/bootstrap.bundle.min.js"></script>
  </body>
</html>
